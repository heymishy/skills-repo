name: PR Checks

# bri-s2.5 - runs on every PR against master: lint, typecheck, unit test
# chain, and build. None of the four steps has continue-on-error - a
# failure in any of them fails this job, which blocks merge once configured
# as a required status check in GitHub branch protection (AC1 - branch
# protection configuration itself is a manual, external-dependency step,
# see the story's test plan Coverage gaps table and this story's AC
# verification script Scenario 1).

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  pr-checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # cpco-s1: this job never runs Playwright -- skip @playwright/test's
        # own postinstall browser download entirely.
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit test chain
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          npm test > test-output.log 2>&1 || true
          # gic-s1: the known-failures baseline is a rule that judges this pull request, so it is also read from the base
          # branch. Entries this pull request adds to its own copy are not honoured (removals are). Fails closed if the base
          # branch cannot be fetched.
          git fetch --no-tags --depth=1 origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          base_baseline=""
          if git cat-file -e "origin/${BASE_REF}:tests/known-baseline-failures.json" 2>/dev/null; then
            git show "origin/${BASE_REF}:tests/known-baseline-failures.json" > "${RUNNER_TEMP}/base-known-baseline-failures.json"
            base_baseline="${RUNNER_TEMP}/base-known-baseline-failures.json"
          fi
          node scripts/ci-test-regression-check.js test-output.log tests/known-baseline-failures.json $base_baseline

      # trr-s1: keep each test file's pass/fail, duration and first failing line for later audits (flakes, slowest, never-failing).
      - name: Upload per-file test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: test-results.json
          retention-days: 90
          if-no-files-found: warn

      - name: Build
        run: npm run build
