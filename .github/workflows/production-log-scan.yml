name: Production Log Scan

# coha-s4 - triggered-and-bounded scheduled scan of recent production logs
# for known error patterns (product/mission.md, product/constraints.md #11
# - never a standing/persistent watcher process). Notifies via coha-s1's
# outbound Teams adapter on a match. Follows this repo's own existing
# schedule: cron: precedent (improvement-agent-schedule.yml,
# purge-e2e-tenants-scheduled.yml).

on:
  schedule:
    - cron: '0 */6 * * *'   # Every 6 hours -- well within the confirmed 7-day log retention
  workflow_dispatch:

jobs:
  scan:
    name: Bounded production-log scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # cpco-s1 pattern: this job never runs Playwright -- skip
        # @playwright/test's own postinstall browser download entirely.
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Run bounded production-log scan
        run: node scripts/production-log-scan.js
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
