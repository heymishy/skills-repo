name: Core browser tests

# lpw-s2: the required-core candidate. Runs only the spec files that tests/e2e/capability-matrix.json puts in lane
# "core" (chosen by scripts/select-core-specs.js from the per-spec coverage measurement), against the PR's own mocked
# test server. Unlike the all-specs job in e2e.yml, nothing here is allowed to fail: a red mark is a real break.
# It is a separate workflow so the e2e.yml job list (guarded by tests/check-b2-ci-gate-config.js) stays as it is.
# It is not a required check until the operator adds it to the ruleset after it has been green on real pull requests.
# Enabled by audit.core_browser_tests: true in .github/context.yml.
# ADR-009: permissions limited to contents: read.

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  core-browser-tests:
    name: Core browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1

      - name: Check opt-in flag (audit.core_browser_tests in context.yml)
        id: core-config
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # ADR-004: .github/context.yml is the single config source of truth. gic-s1: the flag is read from that file AS IT
          # IS ON THE BASE BRANCH (scripts/read-base-flag.js), never from this pull request's checkout, so a pull request
          # cannot switch this required check off by editing the flag in its own copy. Any failure to fetch the base branch
          # or to read the flag fails this step (fail closed); it never falls back to "off".
          git fetch --no-tags --depth=1 origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          # The reader itself comes from the base branch too. Only until gic-s1 has merged does the base lack it; then
          # this checkout's copy is used once, and that is stated in the log.
          if git cat-file -e "origin/${BASE_REF}:scripts/read-base-flag.js" 2>/dev/null; then
            git show "origin/${BASE_REF}:scripts/read-base-flag.js" > "${RUNNER_TEMP}/read-base-flag.js"
          else
            echo "The base branch has no scripts/read-base-flag.js yet (first merge of gic-s1); using this checkout's copy."
            cp scripts/read-base-flag.js "${RUNNER_TEMP}/read-base-flag.js"
          fi
          CORE_ENABLED=$(node "${RUNNER_TEMP}/read-base-flag.js" audit.core_browser_tests --ref "origin/${BASE_REF}")
          echo "core_enabled=${CORE_ENABLED}" >> "$GITHUB_OUTPUT"
          echo "Core browser tests gate flag (from the base branch): ${CORE_ENABLED}"

      - name: Set up Node.js
        if: steps.core-config.outputs.core_enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: steps.core-config.outputs.core_enabled == 'true'
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Cache Playwright browsers
        if: steps.core-config.outputs.core_enabled == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      # pwi-s1: no --with-deps. In this job it only added fonts and upgraded Mesa libraries that the runner image already has,
      # from an apt mirror that serves about 72 kB/s on AWS-hosted runners (install median 212 s there, 16 s on Azure-hosted ones).
      # Chromium's own shared libraries are already on the image. See artefacts/2026-11-20-ci-speed/decisions.md (D1).
      - name: Install Playwright browsers (Chromium only)
        if: steps.core-config.outputs.core_enabled == 'true'
        run: npx playwright install chromium

      - name: Run the core specs
        if: steps.core-config.outputs.core_enabled == 'true'
        id: core-run
        run: |
          CORE_SPECS=$(node scripts/list-core-specs.js)
          echo "Core specs:"; echo "${CORE_SPECS}"
          npx playwright test ${CORE_SPECS} --workers=1 --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: pw-core-report.json
          CI: 'true'
          NODE_ENV: test
          # Test-only credentials, not real OAuth credentials
          GITHUB_CLIENT_ID: e2e-test-client-id
          GITHUB_CLIENT_SECRET: e2e-test-client-secret
          SESSION_SECRET: e2e-test-session-secret-minimum32chars

      - name: Upload the core report and failure traces
        if: always() && steps.core-config.outputs.core_enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: core-browser-report
          path: |
            pw-core-report.json
            test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Core browser tests skipped (opt-in flag not set)
        if: steps.core-config.outputs.core_enabled != 'true'
        run: 'echo "Core browser tests skipped - set audit.core_browser_tests: true in .github/context.yml to enable"'
