# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/
#
# bri-s2.5 - this repo's first committed Fly deploy workflow (see
# decisions.md 2026-07-11 ASSUMPTION entry - the operator's local
# fly-deploy.yml scratch file was never committed to master). Every merge
# to master (this repo's trunk branch - see the earlier 2026-07-11
# ASSUMPTION entry re: main vs master) auto-deploys to the wuce-staging Fly
# app only, then auto-runs the bri-s2.4 seed script in the same job.
# wuce-prod is never touched by this workflow; production promotion is a
# separate, manually-gated job (bri-s2.6, below - job id convention:
# promote-to-prod - see scripts/check-no-prod-deploy-on-push.js).
#
# bri-s2.6 - adds two jobs on top of bri-s2.5's deploy-staging:
#   smoke-test       - runs the currently-available @mocked-tagged
#                       Playwright suite against the staging URL, after
#                       deploy-staging (which includes the seed step).
#                       Reports a real pass/fail (no continue-on-error)
#                       before promote-to-prod can be offered.
#   promote-to-prod   - gated behind (a) needs: smoke-test succeeding, and
#                       (b) a GitHub Actions `environment: production`
#                       protection rule requiring Hamish's explicit
#                       reviewer approval (configured in repo Settings ->
#                       Environments - see
#                       artefacts/2026-07-09-beta-readiness-infra/test-plans/bri-s2.6-smoke-test-promote-gate-test-plan.md
#                       Coverage gaps table). A red smoke-test suite
#                       structurally blocks this job via GitHub Actions'
#                       native needs: behaviour - no `if:` override is
#                       present that could bypass that. Deploys to the
#                       real production Fly app, `skills-framework`
#                       (fly.toml's `app =`), which check-no-prod-deploy-on-push.js
#                       already recognises alongside the story's `wuce-prod`
#                       placeholder vocabulary.

name: Staging Deploy

on:
  push:
    branches:
      - master

jobs:
  deploy-staging:
    name: Deploy to wuce-staging
    runs-on: ubuntu-latest
    concurrency: deploy-group    # optional: ensure only one action runs at a time
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      # dsn-s1: the deploy-staging.js wrapper below has zero external
      # (node_modules) dependencies -- only Node built-ins -- so only Node
      # itself needs to be set up before it runs; npm ci is deferred until
      # right before the later database-seeding step, the only step in this
      # job that actually needs a node_modules install.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # alrf-s2: stamp the build with its commit SHA + originating PR # before
      # the image is built, so the running app can answer "which build is
      # this?" from its own footer/GET /version -- see
      # scripts/write-version-file.js and workspace/capture-log.md (2026-07-26)
      # for the incident this closes (a deploy landed but its overall CI run
      # showed red from an unrelated smoke-test failure, making "did my fix
      # actually deploy?" impossible to answer from the UI alone).
      - name: Write version stamp
        run: node scripts/write-version-file.js
        env:
          GITHUB_SHA: ${{ github.sha }}

      # lcdf-s1: bake the real "learnings captured" count into the image the
      # same way -- workspace/learnings.md is never copied into the deployed
      # image (see Dockerfile), so this must be computed at build time. See
      # scripts/write-learnings-count-file.js and
      # src/web-ui/content/learnings-count.js's fallback tier.
      - name: Write learnings count
        run: node scripts/write-learnings-count-file.js

      # dsn-s1: a single wrapper script (never a raw inline flyctl deploy)
      # so CI and any manual deploy share one code path, with a post-deploy
      # check that fails loudly if fly.staging.toml's config didn't actually
      # apply -- see scripts/deploy-staging.js and workspace/capture-log.md
      # for the recurring incident this fixes.
      - name: Deploy to wuce-staging
        # bri-s2.5's own governance check (T4/IT1) statically verifies this
        # exact "--app wuce-staging" text is visible in this job's run: line,
        # to prove push-to-master never deploys to production by accident --
        # kept visible here even though deploy-staging.js also defaults to
        # the same value, so that static check keeps working unmodified.
        run: node scripts/deploy-staging.js --app wuce-staging
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # dsds-s1: this job never installed dependencies before, so
      # scripts/seed-staging.js's own require('pg') always failed with
      # "Cannot find module 'pg'" -- masked until now because every merge's
      # auto-deploy was already failing earlier, at the FLY_API_TOKEN step
      # (see workspace/capture-log.md), so this step's own failure was never
      # actually reached in CI until that was fixed.
      - name: Install dependencies
        run: npm ci

      - name: Seed staging database (bri-s2.4)
        run: node scripts/seed-staging.js
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

  smoke-test:
    name: Staging smoke test (@mocked)
    needs: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (Chromium only)
        run: npx playwright install --with-deps chromium

      - name: Run @mocked suite against staging
        # rlcc-s1: --workers=1 is a deliberate, narrowly-scoped-to-this-job fix,
        # not a global playwright.config.js change -- same precedented pattern
        # as e2e.yml's a2ccf-s1 fix for a structurally similar problem. Root
        # cause: src/web-ui/server.js's real-LLM-call counter
        # (global.__BRI_S3_2_REAL_LLM_CALL_COUNT__) is one process-wide number
        # with no per-request attribution, shared by every spec against the
        # single, real wuce-staging server. With the default 2-worker
        # concurrency this job previously ran with, one spec's concurrently-
        # running request could increment the counter inside a different
        # spec's own before/after window, failing that spec's "zero real LLM
        # calls" assertion for a reason unrelated to its own correctness
        # (observed live: bri-s3.4 captured beforeCount=1, then afterCount=4).
        # Serializing this job's specs removes the race entirely; it does not
        # touch playwright.config.js, so local/dev parallelism is unaffected.
        run: npx playwright test --grep "@mocked" --workers=1
        env:
          CI: 'true'
          E2E_BASE_URL: https://wuce-staging.fly.dev
          # dss-s1: lets the 4 named /test/* routes these specs depend on
          # work against real staging (which has no NODE_ENV=test guard),
          # matching e2e.yml's existing pattern for Scenario A/B.
          E2E_STAGING_AUTH_STUB_SECRET: ${{ secrets.E2E_STAGING_AUTH_STUB_SECRET }}

      - name: Upload Playwright traces and screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: staging-smoke-test-traces-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      # alrf-s11: purge every e2e-test- tagged tenant this run created,
      # regardless of pass/fail -- this job's @mocked suite also creates real
      # e2e-test- tenants on staging, and this deploy fires on every push to
      # master, so it was contributing to the same accumulation as e2e.yml's
      # Scenario A/B jobs.
      - name: Purge e2e-test- tenants created by this run
        # Fix-forward (2026-07-26, PR #622): see e2e.yml's identical comment --
        # a hung DB connection previously consumed this job's whole timeout
        # budget. This is pure post-run hygiene, never a correctness gate.
        # Deliberately no error-tolerance flag on this step --
        # check-bri-s2.6-smoke-test-promote-gate.js asserts this job (which
        # gates promote-to-prod) has none anywhere in its block; the script
        # itself is written to never exit non-zero regardless.
        if: always()
        timeout-minutes: 2
        run: node scripts/purge-e2e-tenants.js
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

  # pmec-s1: closes the "new staging-safe endpoint + same-PR real-staging
  # E2E test" bootstrapping gap (workspace/capture-log.md, 2026-07-28,
  # dsh-s4 subagent-execution entry; D44 in standards/governance/delivery-patterns.md).
  # staging-deploy.yml only deploys on push to master -- there is no
  # PR-preview deploy mechanism -- so a PR that introduces both a new
  # staging-safe endpoint AND a real-staging E2E test of that same endpoint
  # cannot pass that check on its own pre-merge CI run; the endpoint
  # genuinely isn't live yet. This job re-runs the exact same Scenario A/B
  # spec files (behind the exact same audit.staging_e2e_scenario_a/b flags
  # as e2e.yml) immediately after every real deploy, so that confirmation
  # happens automatically the same day instead of depending on a human
  # remembering to do a manual local re-run. Deliberately NOT a dependency
  # of promote-to-prod (see decisions.md, 2026-07-29) -- smoke-test alone
  # continues to gate promotion; this job is same-day visibility, not a
  # release gate.
  post-deploy-e2e-confirm:
    name: Post-deploy real-staging E2E confirmation
    # sedf-s1: was `needs: deploy-staging` only, which let this job start
    # within 0-1s of smoke-test (both depend only on deploy-staging, no
    # dependency on each other) -- confirmed via job timestamps across 3
    # independent CI runs, always racing. Both suites then hit the same
    # freshly-restarted wuce-staging app AND the same Postgres DB (via their
    # own concurrent purge-e2e-tenants.js calls) at once, right when the app
    # is coldest. Under that combined load, a different timing-sensitive test
    # failed each time (auth-stub <5s round-trip, a 60s product-creation
    # form-interactive wait, a journey-turn endpoint returning an HTML error
    # page instead of JSON) -- a load-contention signature, not a real
    # regression. Sequencing after smoke-test removes the race; smoke-test
    # already gates promote-to-prod, so this ordering doesn't change when
    # promotion becomes available, only removes the concurrent hit.
    needs: [deploy-staging, smoke-test]
    # Run after smoke-test completes regardless of its outcome (pass or
    # fail) -- this job's own purpose (same-day post-deploy confirmation,
    # not a release gate) is independent of smoke-test's result; only the
    # ordering changed, not the "always attempt after a successful deploy"
    # behaviour the original `needs: deploy-staging` alone provided.
    if: ${{ always() && needs.deploy-staging.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check opt-in flags (audit.staging_e2e_scenario_a / _b in context.yml)
        id: pmec-config
        run: |
          # ADR-004: context.yml is the single config source of truth -- same
          # flags e2e.yml's scenario-a-staging-e2e/scenario-b-staging-e2e jobs
          # already read; no new flag introduced by this job.
          SCENARIO_A_ENABLED="false"
          SCENARIO_B_ENABLED="false"
          if [ -f ".github/context.yml" ]; then
            if command -v yq >/dev/null 2>&1; then
              SCENARIO_A_ENABLED=$(yq e '.audit.staging_e2e_scenario_a // false' .github/context.yml)
              SCENARIO_B_ENABLED=$(yq e '.audit.staging_e2e_scenario_b // false' .github/context.yml)
            else
              if grep -q 'staging_e2e_scenario_a: true' .github/context.yml; then
                SCENARIO_A_ENABLED="true"
              fi
              if grep -q 'staging_e2e_scenario_b: true' .github/context.yml; then
                SCENARIO_B_ENABLED="true"
              fi
            fi
          fi
          echo "scenario_a_enabled=${SCENARIO_A_ENABLED}" >> "$GITHUB_OUTPUT"
          echo "scenario_b_enabled=${SCENARIO_B_ENABLED}" >> "$GITHUB_OUTPUT"
          echo "Post-deploy confirmation flags: A=${SCENARIO_A_ENABLED} B=${SCENARIO_B_ENABLED}"

      - name: Set up Node.js
        if: steps.pmec-config.outputs.scenario_a_enabled == 'true' || steps.pmec-config.outputs.scenario_b_enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.pmec-config.outputs.scenario_a_enabled == 'true' || steps.pmec-config.outputs.scenario_b_enabled == 'true'
        run: npm ci

      - name: Install Playwright browsers (Chromium only)
        if: steps.pmec-config.outputs.scenario_a_enabled == 'true' || steps.pmec-config.outputs.scenario_b_enabled == 'true'
        run: npx playwright install --with-deps chromium

      - name: Re-run Scenario A spec files against the freshly-deployed app
        # Same spec file list as e2e.yml's scenario-a-staging-e2e job --
        # kept in sync manually (see delivery-patterns.md D44); this is a
        # re-run of existing pre-merge coverage against confirmed-live code,
        # not new test coverage.
        if: steps.pmec-config.outputs.scenario_a_enabled == 'true'
        id: pmec-scenario-a-run
        run: npx playwright test tests/e2e/a1-staging-auth-stub.spec.js tests/e2e/a2-stripe-test-mode-plan-selection.spec.js tests/e2e/a3-product-feature-ideate-canvas.spec.js tests/e2e/a4-ideate-session-resume.spec.js tests/e2e/dsh-s4-resume-conversation-survives-restart.spec.js --workers=1
        env:
          CI: 'true'
          E2E_STAGING_BASE_URL: ${{ secrets.E2E_STAGING_BASE_URL }}
          E2E_STAGING_AUTH_STUB_SECRET: ${{ secrets.E2E_STAGING_AUTH_STUB_SECRET }}
          E2E_STAGING_ADMIN_PASSWORD: ${{ secrets.E2E_STAGING_ADMIN_PASSWORD }}

      - name: Re-run Scenario B spec file against the freshly-deployed app
        # Same spec file as e2e.yml's scenario-b-staging-e2e job.
        if: steps.pmec-config.outputs.scenario_b_enabled == 'true'
        id: pmec-scenario-b-run
        run: npx playwright test tests/e2e/b1-formed-idea-outer-loop-story-map.spec.js --workers=1
        env:
          CI: 'true'
          E2E_STAGING_BASE_URL: ${{ secrets.E2E_STAGING_BASE_URL }}
          E2E_STAGING_AUTH_STUB_SECRET: ${{ secrets.E2E_STAGING_AUTH_STUB_SECRET }}
          E2E_STAGING_ADMIN_PASSWORD: ${{ secrets.E2E_STAGING_ADMIN_PASSWORD }}

      - name: Upload Playwright traces and screenshots on failure
        if: always() && (steps.pmec-scenario-a-run.outcome == 'failure' || steps.pmec-scenario-b-run.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: post-deploy-e2e-confirm-traces-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      # Same cleanup convention as e2e.yml's Scenario A/B jobs (alrf-s11) --
      # this job's specs also create real e2e-test- tagged tenants.
      - name: Purge e2e-test- tenants created by this run
        if: always() && (steps.pmec-config.outputs.scenario_a_enabled == 'true' || steps.pmec-config.outputs.scenario_b_enabled == 'true')
        timeout-minutes: 2
        run: node scripts/purge-e2e-tenants.js
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

  promote-to-prod:
    name: Promote to production (manual approval required)
    needs: smoke-test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to production
        run: flyctl deploy --remote-only --config fly.toml --app skills-framework
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
