# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/
#
# bri-s2.5 - this repo's first committed Fly deploy workflow (see
# decisions.md 2026-07-11 ASSUMPTION entry - the operator's local
# fly-deploy.yml scratch file was never committed to master). Every merge
# to master (this repo's trunk branch - see the earlier 2026-07-11
# ASSUMPTION entry re: main vs master) auto-deploys to the wuce-staging Fly
# app only, then auto-runs the bri-s2.4 seed script in the same job.
# wuce-prod is never touched by this workflow; production promotion is a
# separate, manually-gated job (bri-s2.6, below - job id convention:
# promote-to-prod - see scripts/check-no-prod-deploy-on-push.js).
#
# bri-s2.6 - adds two jobs on top of bri-s2.5's deploy-staging:
#   smoke-test       - runs the currently-available @mocked-tagged
#                       Playwright suite against the staging URL, after
#                       deploy-staging (which includes the seed step).
#                       Reports a real pass/fail (no continue-on-error)
#                       before promote-to-prod can be offered.
#   promote-to-prod   - gated behind (a) needs: smoke-test succeeding, and
#                       (b) a GitHub Actions `environment: production`
#                       protection rule requiring Hamish's explicit
#                       reviewer approval (configured in repo Settings ->
#                       Environments - see
#                       artefacts/2026-07-09-beta-readiness-infra/test-plans/bri-s2.6-smoke-test-promote-gate-test-plan.md
#                       Coverage gaps table). A red smoke-test suite
#                       structurally blocks this job via GitHub Actions'
#                       native needs: behaviour - no `if:` override is
#                       present that could bypass that. Deploys to the
#                       real production Fly app, `skills-framework`
#                       (fly.toml's `app =`), which check-no-prod-deploy-on-push.js
#                       already recognises alongside the story's `wuce-prod`
#                       placeholder vocabulary.

name: Staging Deploy

on:
  push:
    branches:
      - master

jobs:
  deploy-staging:
    name: Deploy to wuce-staging
    runs-on: ubuntu-latest
    concurrency: deploy-group    # optional: ensure only one action runs at a time
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      # dsn-s1: the deploy-staging.js wrapper below has zero external
      # (node_modules) dependencies -- only Node built-ins -- so only Node
      # itself needs to be set up before it runs; npm ci is deferred until
      # right before the later database-seeding step, the only step in this
      # job that actually needs a node_modules install.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # alrf-s2: stamp the build with its commit SHA + originating PR # before
      # the image is built, so the running app can answer "which build is
      # this?" from its own footer/GET /version -- see
      # scripts/write-version-file.js and workspace/capture-log.md (2026-07-26)
      # for the incident this closes (a deploy landed but its overall CI run
      # showed red from an unrelated smoke-test failure, making "did my fix
      # actually deploy?" impossible to answer from the UI alone).
      - name: Write version stamp
        run: node scripts/write-version-file.js
        env:
          GITHUB_SHA: ${{ github.sha }}

      # dsn-s1: a single wrapper script (never a raw inline flyctl deploy)
      # so CI and any manual deploy share one code path, with a post-deploy
      # check that fails loudly if fly.staging.toml's config didn't actually
      # apply -- see scripts/deploy-staging.js and workspace/capture-log.md
      # for the recurring incident this fixes.
      - name: Deploy to wuce-staging
        # bri-s2.5's own governance check (T4/IT1) statically verifies this
        # exact "--app wuce-staging" text is visible in this job's run: line,
        # to prove push-to-master never deploys to production by accident --
        # kept visible here even though deploy-staging.js also defaults to
        # the same value, so that static check keeps working unmodified.
        run: node scripts/deploy-staging.js --app wuce-staging
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # dsds-s1: this job never installed dependencies before, so
      # scripts/seed-staging.js's own require('pg') always failed with
      # "Cannot find module 'pg'" -- masked until now because every merge's
      # auto-deploy was already failing earlier, at the FLY_API_TOKEN step
      # (see workspace/capture-log.md), so this step's own failure was never
      # actually reached in CI until that was fixed.
      - name: Install dependencies
        run: npm ci

      - name: Seed staging database (bri-s2.4)
        run: node scripts/seed-staging.js
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

  smoke-test:
    name: Staging smoke test (@mocked)
    needs: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (Chromium only)
        run: npx playwright install --with-deps chromium

      - name: Run @mocked suite against staging
        # rlcc-s1: --workers=1 is a deliberate, narrowly-scoped-to-this-job fix,
        # not a global playwright.config.js change -- same precedented pattern
        # as e2e.yml's a2ccf-s1 fix for a structurally similar problem. Root
        # cause: src/web-ui/server.js's real-LLM-call counter
        # (global.__BRI_S3_2_REAL_LLM_CALL_COUNT__) is one process-wide number
        # with no per-request attribution, shared by every spec against the
        # single, real wuce-staging server. With the default 2-worker
        # concurrency this job previously ran with, one spec's concurrently-
        # running request could increment the counter inside a different
        # spec's own before/after window, failing that spec's "zero real LLM
        # calls" assertion for a reason unrelated to its own correctness
        # (observed live: bri-s3.4 captured beforeCount=1, then afterCount=4).
        # Serializing this job's specs removes the race entirely; it does not
        # touch playwright.config.js, so local/dev parallelism is unaffected.
        run: npx playwright test --grep "@mocked" --workers=1
        env:
          CI: 'true'
          E2E_BASE_URL: https://wuce-staging.fly.dev
          # dss-s1: lets the 4 named /test/* routes these specs depend on
          # work against real staging (which has no NODE_ENV=test guard),
          # matching e2e.yml's existing pattern for Scenario A/B.
          E2E_STAGING_AUTH_STUB_SECRET: ${{ secrets.E2E_STAGING_AUTH_STUB_SECRET }}

      - name: Upload Playwright traces and screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: staging-smoke-test-traces-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  promote-to-prod:
    name: Promote to production (manual approval required)
    needs: smoke-test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to production
        run: flyctl deploy --remote-only --config fly.toml --app skills-framework
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
