name: Cross-Tenant Isolation Repeat Gate (bri-s3.4)

# bri-s3.4 AC4/AC5/NFR-Security: the cross-tenant isolation spec is the
# single most security-critical spec in the beta-readiness effort. Unlike
# the general e2e.yml gate (opt-in via audit.e2e_tests, continue-on-error),
# this workflow is:
#   - unconditional on every PR (AC5: "runs on every PR, not just nightly")
#   - blocking, not continue-on-error (NFR-Security: "any failure here blocks
#     merges of unrelated work until root-caused")
#   - run --repeat-each=20 with a zero-skip/zero-flake pass gate (AC4)
# ADR-009: permissions limited to contents: read — no write access.
# ADR-018: Playwright is the E2E framework for the wuce feature.

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  cross-tenant-repeat-gate:
    name: Cross-tenant isolation spec — 20x repeat, zero-tolerance
    # Pinned (was ubuntu-latest): GitHub's ubuntu-latest rolled forward to
    # ubuntu26.04-x64, which Playwright 1.59.1 does not support
    # ("Playwright does not support chromium on ubuntu26.04-x64"). Pin to the
    # last LTS runner Playwright officially supports until Playwright is
    # upgraded. See workspace/capture-log.md, 2026-11-05.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # cpco-s1: skip the postinstall browser download -- Chromium is
        # installed explicitly (and now cached) two steps below.
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      # pwi-s1: no --with-deps. In this job it only added fonts and upgraded Mesa libraries that the runner image already has,
      # from an apt mirror that serves about 72 kB/s on AWS-hosted runners (install median 212 s there, 16 s on Azure-hosted ones).
      # Chromium's own shared libraries are already on the image. See artefacts/2026-11-20-ci-speed/decisions.md (D1).
      - name: Install Playwright browsers (Chromium only)
        run: npx playwright install chromium

      - name: Run cross-tenant isolation spec 20x — zero skip/flake tolerance
        run: npx playwright test tests/e2e/bri-s3.4-cross-tenant-isolation-journey.spec.js --repeat-each=20
        env:
          CI: 'true'
          NODE_ENV: test
          # Test-only credentials — not real OAuth credentials
          GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID || 'e2e-test-client-id' }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET || 'e2e-test-client-secret' }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET || 'e2e-test-session-secret-minimum32chars' }}

      - name: Upload Playwright traces and screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bri-s3.4-cross-tenant-repeat-gate-traces-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
