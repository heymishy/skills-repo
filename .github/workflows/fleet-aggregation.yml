# DEPRECATED (2026-11-16, operator decision, story ciw-s2): this workflow no longer runs on push or on a schedule.
# Why: every hourly run (82 in the audit window) failed at checkout because the FLEET_PUSH_TOKEN secret is missing or empty,
# and the fleet feature is not in use. Kept (not deleted) with a manual trigger only, so the scripts and fleet/squads/ data
# stay usable. To bring it back: set the FLEET_PUSH_TOKEN repository secret, restore the `push` (paths: fleet/squads/**) and
# `schedule` (cron '0 * * * *') triggers below, and update tests/check-ciw-s2-deprecated-workflows.js.
name: Fleet Aggregation

# Originally triggered on push to fleet squad files, on a schedule, or manually; now manual only (see above).
# Reads all fleet/squads/*.json, filters to registry_mode: publishing,
# fetches each pipelineStateUrl, and writes fleet-state.json.
#
# Graceful degradation: unreachable pipelineStateUrl → health: "unknown"
# The job does NOT abort on individual squad failures (AC6).
#
# Performance: designed to complete in ≤60 seconds for ≤20 squads (parallel fetch).
# Security: MC-SEC-02 — no credentials or tokens written to fleet files.

on:
  workflow_dispatch:

jobs:
  aggregate:
    name: Aggregate fleet state
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.FLEET_PUSH_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate squad files
        run: node scripts/validate-squad-file.js fleet/squads/

      - name: Aggregate fleet state
        run: node scripts/fleet-aggregator.js --squads-dir fleet/squads --output fleet-state.json

      - name: Commit fleet-state.json if changed
        run: |
          git config user.email "fleet-aggregator@ci"
          git config user.name "Fleet Aggregator [bot]"
          git add fleet-state.json
          if git diff --cached --quiet; then
            echo "fleet-state.json unchanged — nothing to commit"
          else
            git commit -m "chore: update fleet-state.json [skip ci]"
            git push
          fi
