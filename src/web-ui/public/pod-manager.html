<!-- src/web-ui/public/pod-manager.html -->
<!-- ep1-s1: Pod Manager -- two-panel collaborator picker per design.md's
     "Pod Creation / Collaborator Picker" section (amended 2026-09-14),
     adopted from reference/collaborators-picker-wireframe.html. Reused by
     ep4-s1/ep4-s2 later -- built as a self-contained component from the
     start, not a one-off. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pod Manager</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; background: #f7f7f8; color: #1a1a1a; }
    h1 { font-size: 1.25rem; margin: 0 0 16px; }
    .toolbar { margin-bottom: 16px; }
    button { font: inherit; cursor: pointer; }
    #create-pod-btn { padding: 8px 16px; background: #1a1a1a; color: #fff; border: none; border-radius: 6px; }
    #pod-list { display: flex; flex-direction: column; gap: 8px; }
    .pod-row { background: #fff; border: 1px solid #e2e2e5; border-radius: 8px; padding: 12px 16px; }
    #create-pod-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); align-items: center; justify-content: center; }
    #create-pod-modal.open { display: flex; }
    .modal-body { background: #fff; border-radius: 10px; padding: 24px; width: 720px; max-width: 92vw; }
    .modal-body label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; }
    #pod-name-input { width: 100%; padding: 8px; border: 1px solid #d0d0d5; border-radius: 6px; margin-bottom: 16px; box-sizing: border-box; }
    #roster-search { width: 100%; padding: 6px 8px; border: 1px solid #d0d0d5; border-radius: 6px; margin-bottom: 8px; box-sizing: border-box; font-size: 0.85rem; }
    .picker { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    .picker-panel { border: 1px solid #e2e2e5; border-radius: 8px; padding: 12px; min-height: 220px; }
    .picker-panel h3 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; color: #666; margin: 0 0 8px; }
    .team-group-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; color: #666; margin: 12px 0 4px; }
    .team-group-label:first-child { margin-top: 0; }
    .role-tabs { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
    .role-tab { padding: 2px 10px; border-radius: 999px; border: 1px solid #d0d0d5; background: #fff; font-size: 0.75rem; }
    .role-tab.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
    .roster-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 4px; }
    .role-chip { font-size: 0.7rem; padding: 2px 8px; border-radius: 999px; background: #eef0ff; color: #3341c4; }
    .add-btn, .remove-btn { font-size: 0.75rem; padding: 2px 8px; border: 1px solid #d0d0d5; border-radius: 6px; background: #fff; }
    .role-selector-label { font-size: 0.75rem; margin: 0 4px 0 8px; }
    #error-banner { display: none; background: #fdecea; color: #a4262c; border: 1px solid #f2c1c1; border-radius: 6px; padding: 8px 12px; margin-bottom: 12px; font-size: 0.85rem; }
    #error-banner.visible { display: block; }
    #save-pod-btn { padding: 8px 20px; background: #1a1a1a; color: #fff; border: none; border-radius: 6px; }
    #save-pod-btn:disabled { background: #c8c8cc; cursor: not-allowed; }
    #success-banner { display: none; background: #e6f4ea; color: #1e7e34; border: 1px solid #b6e4c3; border-radius: 6px; padding: 8px 12px; margin-bottom: 12px; font-size: 0.85rem; }
    #success-banner.visible { display: block; }
  </style>
</head>
<body>
  <h1>Pod Manager</h1>
  <div id="success-banner"></div>
  <div class="toolbar">
    <button id="create-pod-btn">Create Pod</button>
  </div>
  <div id="pod-list"></div>

  <div id="create-pod-modal">
    <div class="modal-body">
      <div id="error-banner"></div>
      <label for="pod-name-input">Pod Name</label>
      <input id="pod-name-input" type="text" placeholder="e.g. Core Platform">

      <div class="picker">
        <div class="picker-panel">
          <h3>Available</h3>
          <input type="text" id="roster-search" placeholder="Search by name…">
          <div class="role-tabs" id="role-tabs"></div>
          <div id="available-roster"></div>
        </div>
        <div class="picker-panel">
          <h3>Your team</h3>
          <div id="your-team"></div>
        </div>
      </div>

      <button id="save-pod-btn" disabled>Create Pod</button>
      <button id="cancel-pod-btn">Cancel</button>
    </div>
  </div>

  <script>
    // rtri-s2: real roster fetched from rtri-s1's GET /api/team/members on
    // modal open -- replaces ORG_ROSTER's hardcoded 3-name fixture. Each
    // entry is { identity, role } -- `role` is a TEAM PERMISSION role
    // (admin/engineer/product/viewer), deliberately never read into a pod
    // role (see Architecture Constraints in stories/rtri-s2.md). Populated
    // by fetchRoster(), called from openModal().
    var realRoster = [];
    var VALID_ROLES = ['conductor', 'engineer', 'architect', 'product'];
    var selection = []; // { userId, name, roleId } -- creator pre-included per design.md

    // rtri-s2: role-tab filtering no longer applies to "Available" -- real
    // members carry no pod role until added (AC1/AC7), so role-tabs are
    // hidden entirely (see renderTabs()). Only the search term filters
    // "Available" now.
    var currentSearchTerm = '';

    var modal = document.getElementById('create-pod-modal');
    var nameInput = document.getElementById('pod-name-input');
    var saveBtn = document.getElementById('save-pod-btn');
    var errorBanner = document.getElementById('error-banner');
    var successBanner = document.getElementById('success-banner');
    var rosterSearchInput = document.getElementById('roster-search');

    // Safe DOM construction for a name + role-chip row -- avoids innerHTML
    // string concatenation of user-supplied names. ORG_ROSTER is hardcoded
    // demo data today, but this component is reused by ep4-s1/ep4-s2 against
    // real org data later, so names must never be interpolated into markup.
    function buildNameRoleSpan(name, roleId, suffixText) {
      var wrap = document.createElement('span');
      var nameText = document.createTextNode(name + ' ');
      wrap.appendChild(nameText);
      var chip = document.createElement('span');
      chip.className = 'role-chip';
      chip.textContent = roleId;
      wrap.appendChild(chip);
      if (suffixText) {
        wrap.appendChild(document.createTextNode(' ' + suffixText));
      }
      return wrap;
    }

    // rtri-s2: safe DOM construction for a bare identity string (no role
    // chip) -- used for "Available" panel entries, which carry no pod role
    // until AC7's selector assigns one. Same createElement/textContent
    // discipline as buildNameRoleSpan (MC-SEC-01, AC6).
    function buildIdentitySpan(identity) {
      var span = document.createElement('span');
      span.textContent = identity;
      return span;
    }

    function renderRoster() {
      var el = document.getElementById('available-roster');
      el.innerHTML = '';
      realRoster.filter(function(u) {
        return !currentSearchTerm || u.identity.toLowerCase().indexOf(currentSearchTerm.toLowerCase()) !== -1;
      }).forEach(function(u) {
          var row = document.createElement('div');
          row.className = 'roster-row';
          // AC1: no pod-role chip in "Available" -- real members carry no
          // pod role until assigned via the selector (AC7, added in a later task).
          row.appendChild(buildIdentitySpan(u.identity));
          var btn = document.createElement('button');
          btn.className = 'add-btn';
          btn.textContent = 'Add';
          btn.onclick = function() { showRoleSelector(row, u, btn); };
          row.appendChild(btn);
          el.appendChild(row);
        });
    }

    function renderTabs() {
      // rtri-s2: role-tabs have no meaningful filter target for the real
      // roster (real members carry no pod role until added -- AC1/AC7), so
      // this panel's tabs are hidden entirely rather than rendered-disabled
      // or repurposed (DoR contract, AC5 decision, 2026-09-24).
      var el = document.getElementById('role-tabs');
      el.innerHTML = '';
      el.style.display = 'none';
    }

    function renderTeam() {
      var el = document.getElementById('your-team');
      el.innerHTML = '';
      // Grouped by role per design.md ("the running selection, grouped by
      // role"). Iterate VALID_ROLES for a stable order; skip roles with no
      // selected members so no empty heading renders. Remove still splices
      // the correct index out of the flat `selection` array -- look up each
      // rendered member's index since we're iterating a derived grouping,
      // not `selection` directly by index.
      VALID_ROLES.forEach(function(role) {
        var indexesForRole = [];
        selection.forEach(function(m, i) { if (m.roleId === role) indexesForRole.push(i); });
        if (indexesForRole.length === 0) return;

        var label = document.createElement('p');
        label.className = 'team-group-label';
        label.textContent = role;
        el.appendChild(label);

        indexesForRole.forEach(function(i) {
          if (i === 0) return; // Skip rendering the creator -- kept in selection for API, not shown in UI
          var m = selection[i];
          var row = document.createElement('div');
          row.className = 'roster-row';
          row.appendChild(buildNameRoleSpan(m.name, m.roleId));
          var btn = document.createElement('button');
          btn.className = 'remove-btn';
          btn.textContent = 'Remove';
          btn.onclick = function() { selection.splice(i, 1); renderTeam(); updateGate(); };
          row.appendChild(btn);
          el.appendChild(row);
        });
      });
      updateGate();
    }

    function addMember(u) {
      if (selection.some(function(m) { return m.userId === u.userId; })) return;
      selection.push({ userId: u.userId, name: u.name, roleId: u.roleId });
      renderTeam();
    }

    var _roleSelectorSeq = 0; // rtri-s2: unique id suffix for each selector's <select>/<label> pair

    // rtri-s2 (AC7): replaces a roster row's "Add" button with a pod-role
    // selector (native <select>, matching this app's own labelled-control
    // convention) plus Confirm/Cancel. The selected value -- never
    // realRoster's own `role` field (a team permission role, a different
    // vocabulary) -- is what gets written to pod_members.role_id.
    function showRoleSelector(row, u, addBtn) {
      var selectId = 'pod-role-select-' + (_roleSelectorSeq++);

      var label = document.createElement('label');
      label.setAttribute('for', selectId);
      label.textContent = 'Pod role';
      label.className = 'role-selector-label';

      var select = document.createElement('select');
      select.id = selectId;
      VALID_ROLES.forEach(function(r) {
        var opt = document.createElement('option');
        opt.value = r;
        opt.textContent = r;
        select.appendChild(opt);
      });

      var confirmBtn = document.createElement('button');
      confirmBtn.className = 'add-btn';
      confirmBtn.textContent = 'Confirm';
      confirmBtn.onclick = function() {
        // AC7: the selector's own value is authoritative -- u.role (the
        // roster's team-permission role) is never read here.
        var memberToAdd = { userId: u.identity, name: u.identity, roleId: select.value };
        addMember(memberToAdd);
        renderRoster();
      };

      var cancelBtn = document.createElement('button');
      cancelBtn.className = 'remove-btn';
      cancelBtn.textContent = 'Cancel';
      cancelBtn.onclick = function() {
        renderRoster(); // AC7: no selection change on cancel
      };

      row.removeChild(addBtn);
      row.appendChild(label);
      row.appendChild(select);
      row.appendChild(confirmBtn);
      row.appendChild(cancelBtn);
    }

    // Gated primary action (design.md amendment): disabled until >= 1 member
    // beyond the creator.
    function updateGate() {
      saveBtn.disabled = selection.length < 2;
    }

    function openModal() {
      selection = [{ userId: 'me-uuid', name: 'You', roleId: 'conductor' }]; // creator pre-included by default
      nameInput.value = '';
      errorBanner.classList.remove('visible');
      currentSearchTerm = '';
      rosterSearchInput.value = '';
      renderTabs();
      renderTeam();
      modal.classList.add('open');
      // rtri-s2: fetch the real roster (replaces the old synchronous
      // ORG_ROSTER render). Returns the promise so tests can await
      // completion -- the real onclick handler ignores the return value,
      // matching every other fire-and-forget click handler in this file.
      return fetchRoster();
    }

    // rtri-s2: fetches the real team roster (rtri-s1's GET /api/team/members)
    // and re-renders "Available" once it resolves. Called from openModal().
    function fetchRoster() {
      return fetch('/api/team/members')
        .then(function(r) { return r.json(); })
        .then(function(body) {
          realRoster = (body && body.members) || [];
          renderRoster();
        });
    }

    document.getElementById('create-pod-btn').onclick = openModal;
    document.getElementById('cancel-pod-btn').onclick = function() { modal.classList.remove('open'); };

    rosterSearchInput.oninput = function() {
      currentSearchTerm = rosterSearchInput.value;
      renderRoster();
    };

    saveBtn.onclick = function() {
      var name = nameInput.value.trim();
      fetch('/api/pods/create', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: name,
          members: selection.map(function(m) { return { userId: m.userId, roleId: m.roleId }; })
        })
      }).then(function(r) { return r.json().then(function(body) { return { status: r.status, body: body }; }); })
        .then(function(result) {
          if (result.status !== 200) {
            errorBanner.textContent = result.body.error;
            errorBanner.classList.add('visible');
            return;
          }
          modal.classList.remove('open');
          successBanner.textContent = 'Pod created: ' + result.body.name + ' (' + result.body.memberCount + ' members)';
          successBanner.classList.add('visible');
          var row = document.createElement('div');
          row.className = 'pod-row';
          row.textContent = result.body.name + ' (' + result.body.memberCount + ' members)';
          document.getElementById('pod-list').appendChild(row);
        });
    };
  </script>
</body>
</html>
